[General]
network = MobileIPNetwork
sim-time-limit = 120s

# Mobile IP Configuration
**.mobileNode.mobility.typename = "LinearMobility"
**.mobileNode.mobility.speed = 15mps
**.mobileNode.mobility.initialX = 150m
**.mobileNode.mobility.initialY = 280m
**.mobileNode.mobility.targetX = 480m
**.mobileNode.mobility.targetY = 280m

**.homeAgent.ipv4.ip.forwarding = true
**.foreignAgent.ipv4.ip.forwarding = true

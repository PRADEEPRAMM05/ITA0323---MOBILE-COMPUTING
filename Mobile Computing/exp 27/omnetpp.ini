[General]
network = Cellular5GHandover
sim-time-limit = 100s

# Linear Mobility traversing eNB1 -> eNB2 -> eNB3
**.ue.mobility.typename = "LinearMobility"
**.ue.mobility.initialX = 180m
**.ue.mobility.initialY = 350m
**.ue.mobility.speed = 25mps
**.ue.mobility.targetX = 800m
**.ue.mobility.targetY = 350m

# Handover Measurement Reports (Event A3)
**.ue.cellularNic.nrPhy.handoverHysteresis = 3dB
**.ue.cellularNic.nrPhy.timeToTrigger = 40ms
